name: heatgpt
description: HeatGPT - Urban Heat Island Explorer for Australian LGAs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Map
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Charts
  fl_chart: ^0.68.0

  # HTTP
  dio: ^5.4.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # PDF export
  pdf: ^3.10.8
  share_plus: ^10.1.4

dependency_overrides:
  path_provider_android: 2.2.12

  # Utilities
  intl: ^0.19.0
  flex_color_picker: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
